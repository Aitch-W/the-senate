<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">古罗马书桌上的账本</title>
  <desc id="desc">四十五度俯看书桌：羊皮纸、雅典海景、神庙、罗马柱、帆船、羽毛笔与金币。</desc>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#573923"/>
      <stop offset=".38" stop-color="#3a2415"/>
      <stop offset=".72" stop-color="#2a190f"/>
      <stop offset="1" stop-color="#180e09"/>
    </linearGradient>
    <linearGradient id="woodEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c6338"/>
      <stop offset=".35" stop-color="#4d301c"/>
      <stop offset="1" stop-color="#1b100a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e7c6"/>
      <stop offset=".46" stop-color="#ead8ae"/>
      <stop offset="1" stop-color="#d8bd8c"/>
    </linearGradient>
    <linearGradient id="paperEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a98857"/>
      <stop offset=".5" stop-color="#c4a26c"/>
      <stop offset="1" stop-color="#8b6a3f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7b78f"/>
      <stop offset=".55" stop-color="#e7d6ac"/>
      <stop offset="1" stop-color="#d8c59b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#809f9c"/>
      <stop offset=".35" stop-color="#4d7c82"/>
      <stop offset="1" stop-color="#2d535e"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6a587"/>
      <stop offset=".25" stop-color="#e7dbc2"/>
      <stop offset=".55" stop-color="#cabb9e"/>
      <stop offset=".8" stop-color="#eee2c8"/>
      <stop offset="1" stop-color="#a69172"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dda1"/>
      <stop offset=".42" stop-color="#c99d51"/>
      <stop offset="1" stop-color="#7d5724"/>
    </linearGradient>
    <radialGradient id="ink" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#4d3b2a"/>
      <stop offset="1" stop-color="#17100b"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="13" stdDeviation="13" flood-color="#0b0603" flood-opacity=".6"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r=".55" fill="#3a2415" opacity=".18"/>
      <circle cx="4" cy="5" r=".4" fill="#f6e5bd" opacity=".12"/>
    </pattern>
  </defs>

  <!-- desk -->
  <rect width="1600" height="520" fill="url(#wood)"/>
  <g stroke="#1c110a" stroke-width="2" opacity=".45" fill="none">
    <path d="M-80 640 C260 340 520 200 800 130 C1080 200 1340 340 1680 640"/>
    <path d="M-110 520 C230 300 500 170 800 105 C1100 170 1370 300 1710 520"/>
    <path d="M-140 400 C200 255 470 135 800 80 C1130 135 1400 255 1740 400"/>
    <path d="M-170 280 C170 205 440 95 800 55 C1160 95 1430 205 1770 280"/>
    <path d="M-200 160 C140 150 410 55 800 30 C1190 55 1460 150 1800 160"/>
  </g>
  <g stroke="#0d0805" stroke-width="1" opacity=".26">
    <path d="M0 60 H1600M0 120 H1600M0 180 H1600M0 240 H1600M0 300 H1600M0 360 H1600M0 420 H1600M0 480 H1600"/>
  </g>
  <rect width="1600" height="520" fill="url(#grain)" opacity=".5"/>
  <ellipse cx="820" cy="70" rx="620" ry="170" fill="url(#glow)"/>

  <!-- roman column, left -->
  <g filter="url(#shadow)">
    <g transform="translate(-18,34) skewY(-4)">
      <rect x="0" y="42" width="126" height="430" fill="url(#marble)"/>
      <g stroke="#7e6a4e" stroke-width="1" opacity=".4">
        <path d="M20 58V460M42 54V462M64 50V464M86 50V464M108 54V462"/>
      </g>
      <rect x="-16" y="20" width="158" height="26" fill="#dfd0b2"/>
      <rect x="-10" y="44" width="146" height="12" fill="#a99474"/>
      <path d="M-16 20 H142 V8 C120 16 100 4 78 12 C56 20 26 2 -16 8Z" fill="#e8dcc3"/>
      <path d="M-16 8 C8 0 26 16 50 8 C74 0 100 14 142 8" fill="none" stroke="#b09b7a" stroke-width="2"/>
      <rect x="-16" y="458" width="158" height="18" fill="#cbb999"/>
      <rect x="-26" y="474" width="178" height="12" fill="#8d7758"/>
    </g>
    <path d="M-20 470 q80 44 170 18" stroke="#d9c7a5" stroke-width="2" fill="none" opacity=".4"/>
  </g>

  <!-- parchment sheet -->
  <g transform="translate(122 42) rotate(-1.15)">
    <path d="M12 26 L1216 8 L1258 372 L-4 404 Z" fill="#1a0f09" opacity=".5" filter="url(#soft)" transform="translate(16,18)"/>
    <path d="M8 20 L1210 2 L1252 366 L-8 398 Z" fill="url(#paper)" stroke="url(#paperEdge)" stroke-width="2"/>
    <path d="M16 30 L1202 12" stroke="#fff6dc" stroke-width="2" opacity=".65"/>
    <path d="M0 384 L1242 352" stroke="#b08d5d" stroke-width="1" opacity=".5"/>
    <rect x="10" y="22" width="1228" height="358" fill="url(#grain)" opacity=".32"/>
    <!-- deckled corner -->
    <path d="M8 20 L28 26 L16 38Z" fill="#c6a774" opacity=".8"/>
    <path d="M1252 366 L1230 356 L1244 344Z" fill="#b7935e" opacity=".8"/>
  </g>

  <!-- seascape frame -->
  <g transform="translate(214,54) rotate(-1.1)" filter="url(#shadow)">
    <rect x="-12" y="-12" width="700" height="230" fill="#4b2f1a" stroke="#d3b171" stroke-width="2"/>
    <rect x="0" y="0" width="676" height="206" fill="url(#sky)"/>
    <circle cx="552" cy="40" r="24" fill="#f4e0ac" opacity=".9"/>
    <circle cx="552" cy="40" r="45" fill="#f4e0ac" opacity=".15"/>
    <g fill="#fff8e3" opacity=".5">
      <path d="M40 42 q22 -14 46 0 q-24 10 -46 0Z"/>
      <path d="M430 26 q20 -12 42 0 q-22 9 -42 0Z"/>
      <path d="M300 58 q15 -9 32 0 q-18 7 -32 0Z"/>
    </g>
    <!-- far hills -->
    <path d="M0 128 C85 96 150 112 204 100 C262 86 320 112 372 104 C434 96 492 116 548 108 C604 100 640 112 676 102 L676 150 H0Z" fill="#9a967c" opacity=".75"/>
    <path d="M0 138 C90 120 160 134 220 122 C280 110 330 132 390 126 C452 120 520 136 580 128 C626 122 654 130 676 126 L676 154 H0Z" fill="#7e816c" opacity=".65"/>
    <!-- sea -->
    <rect x="0" y="138" width="676" height="68" fill="url(#sea)"/>
    <g stroke="#cfe0d6" fill="none" opacity=".55">
      <path d="M0 156 q40 -9 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
      <path d="M0 172 q34 -7 68 0 t68 0 t68 0 t68 0 t68 0 t68 0 t68 0 t68 0 t68 0"/>
      <path d="M0 189 q28 -6 56 0 t56 0 t56 0 t56 0 t56 0 t56 0 t56 0 t56 0"/>
    </g>
    <!-- temple on a headland -->
    <path d="M26 150 C54 124 104 118 138 134 L160 150Z" fill="#8f8569"/>
    <g transform="translate(38,64)">
      <rect x="-6" y="76" width="146" height="7" fill="#d9ccb0"/>
      <rect x="0" y="70" width="134" height="7" fill="#eee1c5"/>
      <rect x="8" y="68" width="118" height="4" fill="#a9926e"/>
      <g fill="#eee2c8" stroke="#9b8767" stroke-width="1">
        <rect x="12" y="38" width="9" height="31"/><rect x="30" y="38" width="9" height="31"/>
        <rect x="48" y="38" width="9" height="31"/><rect x="66" y="38" width="9" height="31"/>
        <rect x="84" y="38" width="9" height="31"/><rect x="102" y="38" width="9" height="31"/>
      </g>
      <path d="M2 38 L67 4 L132 38Z" fill="#e9dcc0" stroke="#9b8767" stroke-width="1.4"/>
      <path d="M20 36 L67 12 L114 36" fill="none" stroke="#b5a17f" stroke-width="1.2"/>
      <rect x="58" y="46" width="18" height="23" fill="#6d4a30"/>
      <path d="M8 78 H126" stroke="#b09a76" stroke-width="1.4"/>
    </g>
    <!-- trireme -->
    <g transform="translate(452,126)">
      <path d="M0 52 Q54 66 128 50 L114 62 Q60 72 8 62Z" fill="#4a2d1a"/>
      <path d="M6 54 Q58 64 124 52" stroke="#c79c58" stroke-width="2" fill="none"/>
      <rect x="64" y="-20" width="3" height="74" fill="#3a2616"/>
      <path d="M68 -18 L112 36 H68Z" fill="#ead9b8" stroke="#8a714f" stroke-width="1"/>
      <path d="M68 -18 L68 36" stroke="#a58a60" stroke-width="1"/>
      <path d="M67 -20 L44 -10 L67 6Z" fill="#893b2e"/>
      <g stroke="#4a2d1a" stroke-width="1.5">
        <path d="M16 62 L-8 82M30 64 L10 84M44 65 L28 86M58 66 L48 88M72 66 L68 88M86 65 L88 88M100 64 L106 86"/>
      </g>
      <path d="M-4 82 q40 8 80 0 t60 0" stroke="#d4c3a1" stroke-width="1" fill="none" opacity=".5"/>
    </g>
    <!-- birds -->
    <g stroke="#6b5a43" stroke-width="1.2" fill="none" opacity=".7">
      <path d="M350 32 q6 -6 12 0 q6 -6 12 0"/>
      <path d="M390 48 q5 -5 10 0 q5 -5 10 0"/>
      <path d="M586 62 q5 -5 10 0 q5 -5 10 0"/>
    </g>
    <rect x="0" y="198" width="676" height="8" fill="#d8c39b" opacity=".65"/>
    <g fill="#b3955f" opacity=".75">
      <circle cx="6" cy="6" r="3"/><circle cx="670" cy="6" r="3"/>
      <circle cx="6" cy="200" r="3"/><circle cx="670" cy="200" r="3"/>
    </g>
  </g>

  <!-- quill and inkwell, right -->
  <g transform="translate(1072,214)" filter="url(#shadow)">
    <g transform="rotate(31)">
      <path d="M0 0 C-36 -58 -20 -142 46 -196 C22 -126 26 -58 14 0Z" fill="#efe4cc" stroke="#b49c77" stroke-width="1.2"/>
      <path d="M8 -6 C-8 -58 2 -122 44 -182" stroke="#7e6749" stroke-width="2" fill="none"/>
      <g stroke="#b9a482" stroke-width="1" fill="none" opacity=".8">
        <path d="M18 -30 q22 -4 30 -22M16 -48 q26 -4 38 -26M14 -68 q30 -4 44 -28M12 -88 q32 -3 46 -26M10 -108 q28 -3 42 -24M8 -128 q24 -3 34 -20"/>
        <path d="M12 -30 q-14 -10 -16 -24M10 -52 q-16 -10 -18 -26M8 -74 q-16 -10 -18 -26M6 -96 q-14 -8 -16 -24"/>
      </g>
      <path d="M14 0 L4 36 L18 30Z" fill="#2d1c12"/>
      <path d="M4 36 L18 30 L14 42Z" fill="#c9a35c"/>
    </g>
    <g transform="translate(156,148)">
      <ellipse cx="0" cy="26" rx="54" ry="20" fill="#17100b" opacity=".65"/>
      <path d="M-38 0 C-44 24 -32 44 0 46 C32 44 44 24 38 0Z" fill="#4b3828" stroke="#9a7645" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="38" ry="14" fill="#22170f" stroke="#b48c53" stroke-width="2"/>
      <ellipse cx="0" cy="-2" rx="27" ry="9" fill="#100b08"/>
      <path d="M-24 16 C-12 30 12 32 26 16" stroke="#c79d5b" stroke-width="1.4" fill="none" opacity=".6"/>
    </g>
  </g>

  <!-- coins and seal -->
  <g filter="url(#shadow)">
    <g transform="translate(932,414) rotate(-12)">
      <ellipse cx="0" cy="10" rx="38" ry="13" fill="#4a3218" opacity=".5"/>
      <circle cx="0" cy="0" r="34" fill="url(#gold)" stroke="#7c5724" stroke-width="2"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#f4dda0" stroke-width="1.2" opacity=".75"/>
      <path d="M-12 8 q12 -24 24 0 M-8 1 q8 -12 16 0" stroke="#7c5724" stroke-width="1.4" fill="none"/>
    </g>
    <g transform="translate(990,438) rotate(8)">
      <ellipse cx="0" cy="8" rx="31" ry="11" fill="#4a3218" opacity=".5"/>
      <circle cx="0" cy="0" r="28" fill="url(#gold)" stroke="#7c5724" stroke-width="2"/>
      <circle cx="0" cy="0" r="21" fill="none" stroke="#f4dda0" stroke-width="1.1" opacity=".7"/>
    </g>
    <g transform="translate(883,447) rotate(20)">
      <ellipse cx="0" cy="7" rx="25" ry="9" fill="#4a3218" opacity=".45"/>
      <circle cx="0" cy="0" r="22" fill="#b78a47" stroke="#6f4a1f" stroke-width="1.6"/>
    </g>
    <g transform="translate(1196,414) rotate(-9)">
      <circle cx="0" cy="0" r="30" fill="#7c2f26" stroke="#aa5f4c" stroke-width="2"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#e0b395" stroke-width="1" opacity=".55"/>
      <text x="0" y="8" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#e9c7a9">S</text>
    </g>
  </g>

  <!-- scroll at the right edge -->
  <g transform="translate(1278,264) rotate(83)" filter="url(#shadow)">
    <rect x="0" y="0" width="188" height="54" fill="#e8d4a8" stroke="#b08b58" stroke-width="2"/>
    <g stroke="#8d714b" stroke-width="1" opacity=".55">
      <path d="M14 16 H164M14 25 H150M14 34 H158M14 43 H132"/>
    </g>
    <ellipse cx="188" cy="27" rx="12" ry="27" fill="#d3b37e" stroke="#8c6a3e" stroke-width="2"/>
    <ellipse cx="0" cy="27" rx="9" ry="27" fill="#c49e67" stroke="#8c6a3e" stroke-width="2"/>
  </g>

  <!-- laurel sprig, bottom left -->
  <g transform="translate(126,452) rotate(-14)" stroke="#a98a51" fill="#8c703e" filter="url(#shadow)">
    <path d="M0 36 C44 12 94 4 150 -4" stroke-width="3" fill="none"/>
    <g>
      <ellipse cx="28" cy="22" rx="18" ry="7" transform="rotate(-28 28 22)"/>
      <ellipse cx="54" cy="14" rx="18" ry="7" transform="rotate(-24 54 14)"/>
      <ellipse cx="82" cy="8" rx="18" ry="7" transform="rotate(-18 82 8)"/>
      <ellipse cx="112" cy="2" rx="18" ry="7" transform="rotate(-12 112 2)"/>
      <ellipse cx="28" cy="34" rx="16" ry="6" transform="rotate(26 28 34)" opacity=".7"/>
      <ellipse cx="58" cy="28" rx="16" ry="6" transform="rotate(22 58 28)" opacity=".7"/>
      <ellipse cx="90" cy="20" rx="16" ry="6" transform="rotate(16 90 20)" opacity=".7"/>
    </g>
  </g>

  <!-- foreground desk ledge -->
  <path d="M0 492 C320 476 640 470 960 472 C1230 474 1410 482 1600 494 L1600 520 H0Z" fill="url(#woodEdge)"/>
  <path d="M0 492 C340 476 680 470 1000 472 C1260 474 1430 484 1600 494" stroke="#b58a53" stroke-width="2" fill="none" opacity=".7"/>
  <rect y="506" width="1600" height="14" fill="#100a06" opacity=".55"/>

  <!-- small caption on the parchment -->
  <g transform="translate(770,286) rotate(-1.1)" fill="#6d5330">
    <text x="0" y="0" font-family="Georgia,serif" font-size="12" letter-spacing="4">TABLINVM · RATIO</text>
    <path d="M0 12 H210" stroke="#a98a55" stroke-width="1" opacity=".6"/>
  </g>
</svg>
